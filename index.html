<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>📋 Mini Task Manager</h1>
    <p>Quản lý công việc cá nhân đơn giản và hiệu quả</p>
  </header>

  <div class="container">

    <!-- FORM THÊM CÔNG VIỆC -->
    <div class="card">
      <h2>➕ Thêm công việc mới</h2>
      <form id="task-form">
        <div>
          <label for="task-title">Tên công việc *</label>
          <input type="text" id="task-title" placeholder="Nhập tên công việc..." required>
        </div>
        <div>
          <label for="task-deadline">Hạn hoàn thành</label>
          <input type="date" id="task-deadline">
        </div>
        <div>
          <label for="task-priority">Mức độ ưu tiên</label>
          <select id="task-priority">
            <option value="Cao">🔴 Cao</option>
            <option value="Trung bình" selected>🟡 Trung bình</option>
            <option value="Thấp">🟢 Thấp</option>
          </select>
        </div>
        <button type="submit">Thêm công việc</button>
      </form>
    </div>

    <!-- THANH TÌM KIẾM & LỌC -->
    <div class="card">
      <h2>🔍 Tìm kiếm & Lọc</h2>
      <div class="controls">
        <input type="text" id="search-input" placeholder="Tìm kiếm theo tên công việc...">
        <select id="filter-status">
          <option value="all">Tất cả</option>
          <option value="incomplete">Chưa hoàn thành</option>
          <option value="completed">Đã hoàn thành</option>
        </select>
      </div>
    </div>

    <!-- DANH SÁCH CÔNG VIỆC -->
    <div id="task-list"></div>

  </div><!-- /.container -->

  <!-- FOOTER -->
  <footer>
    <p><b>Họ tên:</b> Ngô Nam Khánh &nbsp;|&nbsp; <b>Mã SV:</b> 224001725</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
